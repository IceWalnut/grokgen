org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ⚠️ 这里**故意不配代理**。
#
# 这台开发机的 shell 里有 http_proxy=127.0.0.1:7890，而 JVM 不读环境变量里的代理，
# 所以本来预期要在这里写 systemProp.http.proxyHost。2026-09-24 实测过：
# repo.maven.apache.org、dl.google.com 的 maven2、services.gradle.org
# **直连全部返回 200**。既然直连通，就不要加一层可能自己坏掉的东西。
#
# ⚠️ 那个代理只影响 shell 里的 curl（所以 curl 要带 --noproxy '*'，ContextPack §4.1），
#    跟 Gradle 和手机都没关系。
